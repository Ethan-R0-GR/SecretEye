name: .NET CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore SecretEyeBot/SecretEyeBot.csproj
      - name: Build
        run: dotnet build SecretEyeBot/SecretEyeBot.csproj --no-restore --configuration Release
