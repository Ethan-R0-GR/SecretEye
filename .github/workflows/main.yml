name: .NET CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Part 1 (console)
        run: dotnet build SecretEyeBot/SecretEyeBot.csproj --configuration Release
      - name: Build Part 2 (GUI)
        run: dotnet build SecretEyeGUI/SecretEyeGUI.csproj --configuration Release
